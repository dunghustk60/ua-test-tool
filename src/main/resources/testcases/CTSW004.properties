# Test Case: CTSW004
# Description: Generate an NDR, if the ATS-message-header has a syntax error
# Reference: EUR Doc 047 Appendix A, Page 20
# Test Class: Erroneous MHS information objects (E3)
# Ref: 4.4.2.5
#
# From the AMHS Test Tool send a sequence of six messages (IPMs) to the IUT addressed to an AMQP consumer.
# Verify that the IUT does not convert the received AMHS messages into AMQP but returns a NDR for each message.
# All NDRs shall contain:
#   - non-delivery-reason-code: unable-to-transfer
#   - non-delivery-diagnostic-code: content-syntax-error
#   - supplementary-information: unable to convert to AMQP due to ATS-message-header or Heading Fields syntax error

subcase.1.id=CTSW004.1
subcase.1.name=Empty Priority
subcase.1.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.1.amhs.subject=CTSW004.1
subcase.1.amhs.body-part-type=ia5-text
subcase.1.amhs.content=Test 1 - Empty ATS-message-priority
subcase.1.amhs.ats-priority=
subcase.1.amhs.expected-result=NDR
subcase.1.amhs.expected-ndr-reason=unable-to-transfer
subcase.1.amhs.expected-ndr-diagnostic=content-syntax-error
subcase.1.amhs.expected-ndr-supplementary=unable to convert to AMQP due to ATS-message-header or Heading Fields syntax error

