# Test Case: CTSW002 - Convert an incoming IPM containing Optional-Heading-Information (OHI) 
#              or Originators-Reference element
# Description: Test conversion of IPMs with OHI in ATS-message-header or originators-reference
# Reference: EUR Doc 047 Appendix A, Page 18, Section 4.4.3.4.6
# Test Criteria: Successful if IUT converts IPM with OHI/originators-reference correctly into AMQP
# Verification: Check AMQP format, OHI application property contents

# ============================================================================
# MESSAGES WITH OPTIONAL-HEADING-INFORMATION (OHI)
# ============================================================================

# Subcase 1: ATS message with FF priority and OHI text
subcase.1.id=CTSW002.1
subcase.1.name=FF Priority with OHI
subcase.1.description=First ATS message with FF priority containing OHI text
subcase.1.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.1.amhs.subject=CTSW002.1 - FF Priority with OHI
subcase.1.amhs.priority-indicator=FF
subcase.1.amhs.body-part-type=ia5-text
subcase.1.amhs.content=ATS message text for FF priority with optional heading information
subcase.1.amhs.optional-heading-info=OHI text content for FF priority message - testing OHI conversion
subcase.1.amhs.header-empty=false

# Subcase 2: ATS message with SS priority and OHI text
subcase.2.id=CTSW002.2
subcase.2.name=SS Priority with OHI
subcase.2.description=Second ATS message with SS priority containing OHI text
subcase.2.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.2.amhs.subject=CTSW002.2 - SS Priority with OHI
subcase.2.amhs.priority-indicator=SS
subcase.2.amhs.body-part-type=ia5-text
subcase.2.amhs.content=ATS message text for SS priority with optional heading information
subcase.2.amhs.optional-heading-info=OHI text content for SS priority message - supervisory level
subcase.2.amhs.header-empty=false

# ============================================================================
# MESSAGES WITH ORIGINATORS-REFERENCE ELEMENT
# ============================================================================

# Subcase 3: IPM with precedence 57 and originators-reference
subcase.3.id=CTSW002.3
subcase.3.name=Precedence 57 with Originator Reference
subcase.3.description=Third message with precedence 57 containing originators-reference element
subcase.3.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.3.amhs.subject=CTSW002.3 - Precedence 57 with Originator Reference
subcase.3.amhs.precedence=57
subcase.3.amhs.body-part-type=general-text-body-part
subcase.3.amhs.charset-reg-numbers=1,6
subcase.3.amhs.repertoire=ISO646
subcase.3.amhs.content=Extended ATS message text with precedence 57 and originator reference
subcase.3.amhs.originator-reference=OR-REF-57-Unique-Identifier-For-Tracking
#subcase.3.amhs.responsibility=responsible
#subcase.3.amhs.authorization-time=20250102100000
subcase.3.amhs.extended=true
subcase.3.amhs.priority-indicator=FF

# Subcase 4: IPM with precedence 107 and originators-reference
subcase.4.id=CTSW002.4
subcase.4.name=Precedence 107 with Originator Reference
subcase.4.description=Fourth message with precedence 107 containing originators-reference element
subcase.4.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.4.amhs.subject=CTSW002.4 - Precedence 107 with Originator Reference
subcase.4.amhs.precedence=107
subcase.4.amhs.body-part-type=general-text-body-part
subcase.4.amhs.charset-reg-numbers=1,6
subcase.4.amhs.repertoire=ISO646
subcase.4.amhs.content=Extended ATS message text with precedence 107 and originator reference
subcase.4.amhs.originator-reference=OR-REF-107-Emergency-Message-Identifier
#subcase.4.amhs.responsibility=responsible
#subcase.4.amhs.authorization-time=20250102110000
subcase.4.amhs.priority-indicator=SS
subcase.4.amhs.extended=true
