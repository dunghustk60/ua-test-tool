# Test Case: CTSW005
# Description: Generate an NDR, if current time exceeds the latest delivery time of IPM
# Reference: EUR Doc 047 Appendix A, Page 21
# Test Class: Normal communications (N)
# Ref: 4.4.5, Doc9880_4.5.2.4.11

# Subcase 1: latest-delivery-time set to a date in the past
#   -> IUT MUST NOT convert; MUST return NDR:
#      non-delivery-reason-code  : unable-to-transfer
#      non-delivery-diagnostic-code : maximum-time-expired
subcase.1.id=CTSW005.1
subcase.1.name=Latest Delivery Time in Past
subcase.1.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.1.amhs.subject=CTSW005.1
subcase.1.amhs.body-part-type=ia5-text
subcase.1.amhs.content=Test message with latest-delivery-time in the past
subcase.1.amhs.content-type=22
subcase.1.amhs.charset-reg-number=6
subcase.1.amhs.message-type=ipm
subcase.1.amhs.ats-priority=FF
subcase.1.amhs.originator-report-request=non-delivery-report
subcase.1.amhs.originating-mta-report-request=no-report
subcase.1.amhs.receipt-notification=none
# Resolved at send time to UTCTime format YYMMDDHHMMSSZ
subcase.1.amhs.latest-delivery-time=now-1d
subcase.1.amhs.expected-result=NDR
subcase.1.amhs.expected-ndr-reason=unable-to-transfer
subcase.1.amhs.expected-ndr-diagnostic=maximum-time-expired

# Subcase 2: latest-delivery-time later than current time
#   -> IUT MUST accept and convert to AMQP; message received at AMQP interface
subcase.2.id=CTSW005.2
subcase.2.name=Latest Delivery Time in Future
subcase.2.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.2.amhs.subject=CTSW005.2
subcase.2.amhs.body-part-type=ia5-text
subcase.2.amhs.content=Test message with latest-delivery-time in the future
subcase.2.amhs.content-type=22
subcase.2.amhs.charset-reg-number=6
subcase.2.amhs.message-type=ipm
subcase.2.amhs.ats-priority=FF
subcase.2.amhs.originator-report-request=non-delivery-report
subcase.2.amhs.originating-mta-report-request=no-report
subcase.2.amhs.receipt-notification=none
# Resolved at send time to UTCTime format YYMMDDHHMMSSZ
subcase.2.amhs.latest-delivery-time=now+1d
subcase.2.amhs.expected-result=accepted
