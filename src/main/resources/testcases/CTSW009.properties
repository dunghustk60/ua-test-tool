# Test Case: CTSW009
# Description: Distribute an IPM to AMHS users and AMQP consumers
# Reference: EUR Doc 047 Appendix A, Page 25
# Test Class: Normal communications (N)
# Ref: 4.4.3.4.4 - BCC and CC Recipients
#
# The message shall have the originator-report-request flag set to "non-delivery-report".
# Both messages shall be relayed to AMHS and converted to AMQP format.

# Subcase 1: Primary (AMHS+AMQP) & Copy (AMHS+AMQP)
#   MTE contains all AMHS recipient addresses
#   IPM heading contains all AMHS and AMQP recipients
subcase.1.id=CTSW009.1
subcase.1.name=Primary AMHS+AMQP & Copy AMHS+AMQP
subcase.1.amhs.primary-recipients=/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/,/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.1.amhs.copy-recipients=/CN=VVTSOPTA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/,/CN=VVTSOPTB/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.1.amhs.subject=CTSW009.1
subcase.1.amhs.body-part-type=ia5-text
subcase.1.amhs.content=Test 1 - Primary and Copy recipients AMHS and AMQP
subcase.1.amhs.originator-report-request=non-delivery-report
subcase.1.amhs.expected-result=accepted
subcase.1.amhs.ats-priority=FF

# Subcase 2: Primary (AMHS+AMQP) & Blind-Copy (AMHS+AMQP)
#   MTE contains only AMHS blind-copy recipient address
#   IPM heading contains all AMHS and AMQP recipients
subcase.2.id=CTSW009.2
subcase.2.name=Primary AMHS+AMQP & BCC AMHS+AMQP
subcase.2.amhs.primary-recipients=/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/,/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.2.amhs.blind-copy-recipients=/CN=VVTSAMHS/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/,/CN=VVTSOPTB/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.2.amhs.delivery-mode=per-recipient
subcase.2.amhs.subject=CTSW009.2
subcase.2.amhs.body-part-type=ia5-text
subcase.2.amhs.content=Test 2 - Primary and Blind-Copy recipients AMHS and AMQP
subcase.2.amhs.originator-report-request=non-delivery-report
subcase.2.amhs.expected-result=accepted
subcase.2.amhs.ats-priority=FF
