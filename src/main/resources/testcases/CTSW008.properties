# Test Case: CTSW008
# Description: Reject an IPM with unsupported content-type
# Reference: EUR Doc 047 Appendix A, Page 24
# Test Class: Erroneous MHS information objects (E3)
# Ref: 4.4.1.1, 4.4.8
#
# IMPORTANT (per spec): ALL messages shall contain an IPM body with
# ATS-message-header and ATS-message-text (ia5-text body part).
# Subcase 1 is ACCEPTED (content-type 22 = interpersonal-messaging-1988).
# Subcases 2, 3, 4 are REJECTED → NDR.

# Subcase 1: content-type = interpersonal-messaging-1988(22) [ACCEPTED]
subcase.1.id=CTSW008.1
subcase.1.name=Interpersonal-Messaging-1988(22)
subcase.1.amhs.recipient=/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.1.amhs.subject=CTSW008.1
subcase.1.amhs.content-type=22
subcase.1.amhs.body-part-type=ia5-text
subcase.1.amhs.content=ATS message header and text with content-type 22
subcase.1.amhs.expected-result=accepted

# Subcase 2: content-type = interpersonal-messaging-1984(2) [REJECTED]
#   -> NDR:
#      non-delivery-reason-code     : unable-to-transfer
#      non-delivery-diagnostic-code : content-type-not-supported
subcase.2.id=CTSW008.2
subcase.2.name=Interpersonal-Messaging-1984(2)
subcase.2.amhs.recipient=/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.2.amhs.subject=CTSW008.2
subcase.2.amhs.content-type=2
subcase.2.amhs.body-part-type=ia5-text
subcase.2.amhs.content=ATS message header and text with content-type 2
subcase.2.amhs.expected-result=NDR
subcase.2.amhs.expected-ndr-reason=unable-to-transfer
subcase.2.amhs.expected-ndr-diagnostic=content-type-not-supported

# Subcase 3: content-type = edi-messaging(35) [REJECTED]
#   -> NDR:
#      non-delivery-reason-code     : unable-to-transfer
#      non-delivery-diagnostic-code : content-type-not-supported
subcase.3.id=CTSW008.3
subcase.3.name=EDI-Messaging(35)
subcase.3.amhs.recipient=/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.3.amhs.subject=CTSW008.3
subcase.3.amhs.content-type=35
subcase.3.amhs.body-part-type=ia5-text
subcase.3.amhs.content=ATS message header and text with content-type 35
subcase.3.amhs.expected-result=NDR
subcase.3.amhs.expected-ndr-reason=unable-to-transfer
subcase.3.amhs.expected-ndr-diagnostic=content-type-not-supported

# Subcase 4: content-type = unidentified(0) [REJECTED]
#   -> NDR:
#      non-delivery-reason-code     : unable-to-transfer
#      non-delivery-diagnostic-code : content-type-not-supported
subcase.4.id=CTSW008.4
subcase.4.name=Unidentified(0)
subcase.4.amhs.recipient=/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
