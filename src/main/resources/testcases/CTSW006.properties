# Test Case: CTSW006
# Description: Reject an IPM if the size of the payload in bytes exceeds the maximum configured
# Reference: EUR Doc 047 Appendix A, Page 22
# Test Class: Procedural errors (E2)
# Ref: 4.4.2.6, 4.4.8
#
# IMPORTANT (per spec): ALL three messages shall have BOTH:
#   - originator-report-request = non-delivery-report
#   - originating-MTA-report-request = non-delivery-report
# and contain the recipient address of an AMQP consumer.

# Subcase 1 (a): IA5-text payload WITHIN the Maximum message data size limit
#   -> IUT accepts and converts; message received at AMQP test interface
subcase.1.id=CTSW006.1
subcase.1.name=Payload within Limit (IA5)
subcase.1.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.1.amhs.subject=CTSW006.1
subcase.1.amhs.body-part-type=ia5-text
subcase.1.amhs.originator-report-request=non-delivery-report
subcase.1.amhs.originating-mta-report-request=non-delivery-report
subcase.1.amhs.payload-size=1024
subcase.1.amhs.content=Test IA5 payload within the maximum configured size limit
subcase.1.amhs.expected-result=accepted
subcase.1.amhs.message-type=ipm
subcase.1.amhs.ats-priority=FF

# Subcase 2 (b): IA5-text payload EXCEEDING the Maximum message data size limit
#   -> IUT rejects for all recipients; returns NDR:
#      non-delivery-reason-code     : unable-to-transfer
#      non-delivery-diagnostic-code : content-too-long
#      supplementary-information    : unable to convert to AMQP due to the content size
subcase.2.id=CTSW006.2
subcase.2.name=Payload exceeds Limit (IA5)
subcase.2.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.2.amhs.subject=CTSW006.2
subcase.2.amhs.body-part-type=ia5-text
subcase.2.amhs.originator-report-request=non-delivery-report
subcase.2.amhs.originating-mta-report-request=non-delivery-report
subcase.2.amhs.payload-size=15001
subcase.2.amhs.expected-result=NDR
subcase.2.amhs.expected-ndr-reason=unable-to-transfer
subcase.2.amhs.expected-ndr-diagnostic=content-too-long
subcase.2.amhs.expected-ndr-supplementary=unable to convert to AMQP due to the content size
subcase.2.amhs.message-type=ipm
subcase.2.amhs.ats-priority=FF

# Subcase 3 (c): File-transfer-body-part payload EXCEEDING the Maximum message data size limit
#   -> IUT rejects for all recipients; returns NDR with same elements as subcase 2
subcase.3.id=CTSW006.3
subcase.3.name=Payload exceeds Limit (FTBP)
subcase.3.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.3.amhs.subject=CTSW006.3
subcase.3.amhs.body-part-type=file-transfer-body-part
subcase.3.amhs.ftbp-file-name=ctsw006-3-exceed-limit.bin
subcase.3.amhs.originator-report-request=non-delivery-report
subcase.3.amhs.originating-mta-report-request=non-delivery-report
subcase.3.amhs.payload-size=15001
subcase.3.amhs.expected-result=NDR
subcase.3.amhs.expected-ndr-reason=unable-to-transfer
subcase.3.amhs.expected-ndr-diagnostic=content-too-long
subcase.3.amhs.expected-ndr-supplementary=unable to convert to AMQP due to the content size
subcase.3.amhs.message-type=ipm
subcase.3.amhs.ats-priority=FF
subcase.3.amhs.content=Test FTBP payload exceeding limit
