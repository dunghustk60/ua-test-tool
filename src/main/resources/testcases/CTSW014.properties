# Test Case: CTSW014
# Description: Incoming RN relating to a subject message with priority different from "SS"
# Reference: EUR Doc 047 Appendix A, Page 30
# Test Class: Normal communications (N)
# Ref: 4.4.7.1, 4.4.7.2, 4.4.7.3, 4.4.1.2 b)
# Procedure: receive subject IPMs that request RN with ATS priorities SS and DD.
# Send All submits their generated RNs in subcase order: SS first, DD second.
# IUT Control Position logging/reporting and DD RN storage are manual checks.

subcase.1.id=CTSW014.1
subcase.1.name=Subject Priority SS
