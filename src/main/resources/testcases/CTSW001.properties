# Test Case: CTSW001 - Convert an incoming IPM to AMQP format
# Description: Test conversion of IPMs with various priorities to AMQP format
# Reference: EUR Doc 047 Appendix A, Page 16-17, Section 4
# Test Criteria: Successful if IUT converts IPM into AMQP format correctly
# Verification: Check AMQP message format, priority mapping (amhs_ats_pri and AMQP Header),
#               filing time (amhs_ats_ft), durable=true, amhs_ipm_id, message text comparison

# ============================================================================
# BASIC IPM SECTION - Messages with ia5-text body part
# Each message shall have different ATS-filing-time and ATS-message-text
# Optional-heading-information element shall be empty
# ============================================================================

# Subcase 1: Basic IPM with ATS-message-priority KK (highest)
subcase.1.id=CTSW001.1
subcase.1.name=Basic IPM - Priority KK
subcase.1.description=First ATS message with priority KK, ia5-text body, empty OHI
subcase.1.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.1.amhs.subject=CTSW001.1 - Basic IPM Priority KK
subcase.1.amhs.priority=KK
subcase.1.amhs.priority-indicator=KK
subcase.1.amhs.body-part-type=ia5-text
subcase.1.amhs.content=CTSW001.1 - ATS MESSAGE TEXT FOR PRIORITY KK TEST
subcase.1.amhs.optional-heading-info=
subcase.1.amhs.header-empty=true
subcase.1.amhs.notify-control-position=false

