# ============================================================================
# EXTENDED IPM SECTION - Messages with general-text-body-part
# Each message shall have different authorization-time and text
# Originators-reference element shall be empty, subject field shall contain information
# Two or more recipients shall have responsibility=responsible, at least one not responsible
# All extended IPMs must have multiple recipients per EUR Doc 047 specification
# ============================================================================

# Subcase 6: Extended IPM with precedence 14
# Must have 2+ responsible recipients and 1+ not-responsible recipient
subcase.6.id=CTSW001.6
subcase.6.name=Extended IPM - Precedence 14
subcase.6.description=First extended message with precedence 14, general-text-body-part, multiple recipients
subcase.6.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.6.amhs.subject=CTSW001.6 - Extended IPM Precedence 14
subcase.6.amhs.precedence=14
subcase.6.amhs.body-part-type=general-text-body-part
subcase.6.amhs.charset-reg-numbers=1,6
subcase.6.amhs.repertoire=ISO646
subcase.6.amhs.content=CTSW001.6 EXTENDED ATS MESSAGE TEXT WITH PRECEDENCE 14 - ISO 646 CHARACTERS
subcase.6.amhs.originator-reference=
#subcase.6.amhs.authorization-time=20250101100000
subcase.6.amhs.responsibility=responsible
subcase.6.amhs.extended=true
subcase.6.amhs.priority-indicator=KK

