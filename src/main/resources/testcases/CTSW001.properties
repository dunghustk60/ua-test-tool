# Subcase 11: Extended IPM with two AMQP recipients (precedence 107 and 14)
# Priority shall be mapped from highest precedence (107)
# Both recipients are responsible and shall be included in amhs_recipients
subcase.11.id=CTSW001.11
subcase.11.name=Extended IPM - Dual Recipients (107/14)
subcase.11.description=Sixth message addressing multiple AMQP recipients with different precedences
subcase.11.amhs.recipient=/CN=VVTSOPTB/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/,/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.11.amhs.primary-recipients=/CN=VVTSOPTC/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/,/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.11.amhs.subject=CTSW001.11 - Extended IPM Dual Recipients
subcase.11.amhs.recipient-precedences=107,14
subcase.11.amhs.body-part-type=general-text-body-part
subcase.11.amhs.extended=true
subcase.11.amhs.charset-reg-numbers=1,6
subcase.11.amhs.repertoire=ISO646
subcase.11.amhs.content=Extended ATS message with multiple recipients - highest precedence 107 used for priority mapping
subcase.11.amhs.originator-reference=
subcase.11.amhs.responsibility=responsible,not-responsible
#subcase.11.amhs.authorization-time=20250101150000
subcase.11.amhs.notify-control-position=true
subcase.11.amhs.priority-indicator=SS
# Note: Priority in AMQP shall be mapped from highest precedence (107) per EUR Doc 047

