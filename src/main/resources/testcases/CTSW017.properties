# Subcase 1: ia5-text-body-part with original-EIT = extended OID 2.6.3.4.2 [ACCEPTED]
subcase.1.id=CTSW017.1
subcase.1.name=Extended EIT 2.6.3.4.2
subcase.1.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.1.amhs.subject=CTSW017
subcase.1.amhs.body-part-type=ia5-text
subcase.1.amhs.eit-type=extended
subcase.1.amhs.eit-oid=2.6.3.4.2
subcase.1.amhs.content=FF VVTSSWIM 290900 VVTSUAAT TEST CTSW017.1 IA5 MESSAGE
subcase.1.amhs.expected-result=accepted
subcase.1.amhs.ats-priority=FF

