# Test Case: CTSW007
# Description: Reject an IPM with multiple body parts
# Reference: EUR Doc 047 Appendix A, Page 23
# Test Class: Erroneous MHS information objects (E3)
# Ref: 4.4.2.2, 4.4.2.4, 4.4.8
#
# IMPORTANT: Support is limited to two body parts: ONE text body part with
# ATS message header + ONE FTBP. Subcases 1 and 2 are VALID (received at AMQP).
# Subcases 3 and 4 are INVALID and must return NDR.
# NOTE: The supplementary-information text DIFFERS between subcase 3 and 4.

# Subcase 1: basic ia5-text + file-transfer-body-part [TWO PARTS - VALID]
#   -> BOTH messages received at AMQP test interface
subcase.1.id=CTSW007.1
subcase.1.name=Text + FTBP (Valid)
subcase.1.amhs.recipient=/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.1.amhs.subject=CTSW007.1
subcase.1.amhs.body-part-types=ia5-text,file-transfer-body-part
subcase.1.amhs.originator-report-request=non-delivery-report
subcase.1.amhs.originating-mta-report-request=non-delivery-report
subcase.1.amhs.content=ATS message header and text with FTBP attachment
subcase.1.amhs.ftbp-file-name=test_attachment_1.bin
subcase.1.amhs.ftbp-content=Hello FTBP 1
subcase.1.amhs.expected-result=accepted

# Subcase 2: general-text-body-part + file-transfer-body-part [TWO PARTS - VALID]
#   -> BOTH messages received at AMQP test interface
subcase.2.id=CTSW007.2
subcase.2.name=General-Text + FTBP (Valid)
subcase.2.amhs.recipient=/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.2.amhs.subject=CTSW007.2
subcase.2.amhs.body-part-types=general-text-body-part,file-transfer-body-part
subcase.2.amhs.charset-reg-numbers=1,6
subcase.2.amhs.repertoire=ISO646
subcase.2.amhs.originator-report-request=non-delivery-report
subcase.2.amhs.originating-mta-report-request=non-delivery-report
subcase.2.amhs.content=ATS message general text and FTBP attachment
subcase.2.amhs.ftbp-file-name=test_attachment_2.bin
subcase.2.amhs.ftbp-content=Hello FTBP 2
subcase.2.amhs.expected-result=accepted

# Subcase 3: two ia5-text body parts [INVALID - unsupported body part type]
#   -> NDR returned with:
#      non-delivery-reason-code     : unable-to-transfer
#      non-delivery-diagnostic-code : content-syntax-error
#      supplementary-information    : unable to convert to AMQP due to unsupported body part type
subcase.3.id=CTSW007.3
subcase.3.name=Two IA5-Text (Invalid)
subcase.3.amhs.recipient=/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.3.amhs.subject=CTSW007.3
subcase.3.amhs.body-part-types=ia5-text,ia5-text
subcase.3.amhs.originator-report-request=non-delivery-report
subcase.3.amhs.originating-mta-report-request=non-delivery-report
subcase.3.amhs.content=Two ia5-text body parts invalid
subcase.3.amhs.expected-result=NDR
subcase.3.amhs.expected-ndr-reason=unable-to-transfer
subcase.3.amhs.expected-ndr-diagnostic=content-syntax-error
subcase.3.amhs.expected-ndr-supplementary=unable to convert to AMQP due to unsupported body part type

# Subcase 4: ia5-text + general-text-body-part + file-transfer-body-part [INVALID - multiple body parts]
#   -> NDR returned with:
#      non-delivery-reason-code     : unable-to-transfer
#      non-delivery-diagnostic-code : content-syntax-error
#      supplementary-information    : unable to convert to AMQP due to multiple body parts
subcase.4.id=CTSW007.4
subcase.4.name=Three Body Parts (Invalid)
subcase.4.amhs.recipient=/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.4.amhs.subject=CTSW007.4
subcase.4.amhs.body-part-types=ia5-text,general-text-body-part,file-transfer-body-part
subcase.4.amhs.originator-report-request=non-delivery-report
subcase.4.amhs.originating-mta-report-request=non-delivery-report
subcase.4.amhs.content=Three body parts invalid
subcase.4.amhs.expected-result=NDR
subcase.4.amhs.expected-ndr-reason=unable-to-transfer
subcase.4.amhs.expected-ndr-diagnostic=content-syntax-error
subcase.4.amhs.expected-ndr-supplementary=unable to convert to AMQP due to multiple body parts
