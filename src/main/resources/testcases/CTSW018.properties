# Test Case: CTSW018
# Description: Incoming IPM with a general-text-body-part and ISO 646 repertoire
# Reference: EUR Doc 047 Appendix A, Page 35
# Test Class: Normal communications (N)
# Ref: 4.4.2.3, 4.4.3.3.3, 4.4.3.4.9, 4.4.4.5, Table 6

# Both messages shall contain general-text-body-part with ATS-message-header and ATS-message-text.
# original-EIT = extended OIDs {id-cs-eit-authority 1} and {id-cs-eit-authority 6}
# conversion-with-loss-prohibited = conversion-with-loss-allowed

# Subcase 1: ISO 646 characters only [ACCEPTED]
subcase.1.id=CTSW018.1
subcase.1.name=ISO 646 only
subcase.1.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.1.amhs.subject=CTSW018.1
subcase.1.amhs.body-part-type=general-text-body-part
subcase.1.amhs.charset-reg-numbers=1,6
subcase.1.amhs.repertoire=ISO646
subcase.1.amhs.eit-type=extended
subcase.1.amhs.eit-oid=id-cs-eit-authority-1,id-cs-eit-authority-6
subcase.1.amhs.conversion-with-loss=allowed
subcase.1.amhs.content=GCXZAB012345 ISO 646 US-ASCII ONLY VALID
subcase.1.amhs.expected-result=accepted
subcase.1.amhs.ats-priority=FF

# Subcase 2: US-ASCII plus non-listed US-ASCII characters [ACCEPTED]
subcase.2.id=CTSW018.2
subcase.2.name=US-ASCII + non-listed
subcase.2.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.2.amhs.subject=CTSW018.2
subcase.2.amhs.body-part-type=general-text-body-part
subcase.2.amhs.charset-reg-numbers=1,6
subcase.2.amhs.repertoire=ISO646
subcase.2.amhs.eit-type=extended
subcase.2.amhs.eit-oid=id-cs-eit-authority-1,id-cs-eit-authority-6
subcase.2.amhs.conversion-with-loss=allowed
subcase.2.amhs.content=TEST MESSAGE WITH NON-LISTED US-ASCII CHARACTERS \n SPECIAL SYMBOLS: [ ] { } \ | ~ ` ^ _ \n REFERENCE: FLIGHT_VN123@VVTS
subcase.2.amhs.expected-result=accepted
subcase.2.amhs.ats-priority=FF
