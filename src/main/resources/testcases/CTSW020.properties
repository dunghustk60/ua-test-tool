# Test Case: CTSW020
# Description: Notify SS to Control Position
# Reference: EUR Doc 047 Appendix A, Page 38
# Test Class: Normal communications (N)
# Ref: 4.4.4.4 - Notify SS or precedence 107 to Control position
#
# Test criteria: IUT logs and reports to Control Position when responsibility=responsible AND:
#   - highest precedence element = 107 (extended IPM), OR
#   - priority-indicator = SS (basic IPM)
# Also the IPM shall be converted to AMQP correctly.

# Subcase 1: Extended IPM, 2 AMQP consumers (responsible), precedence 107 and 28
#   -> CP notification expected (prec 107)
subcase.1.id=CTSW020.1
subcase.1.name=2 AMQP Prec 107 and 28
subcase.1.amhs.primary-recipients=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/,/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.1.amhs.subject=CTSW020.1
subcase.1.amhs.body-part-type=general-text-body-part
subcase.1.amhs.charset-reg-numbers=1,6
subcase.1.amhs.repertoire=ISO646
subcase.1.amhs.precedence=107
subcase.1.amhs.recipient-precedences=107,28
subcase.1.amhs.responsibility=responsible,responsible
subcase.1.amhs.content=Extended IPM precedence 107 and 28 both responsible
subcase.1.amhs.notify-control-position=true

# Subcase 2: Basic IPM, 2 AMQP consumers (responsible), priority SS
#   -> CP notification expected (SS)
subcase.2.id=CTSW020.2
subcase.2.name=2 AMQP Priority SS
subcase.2.amhs.primary-recipients=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/,/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.2.amhs.subject=CTSW020.2
subcase.2.amhs.body-part-type=ia5-text
subcase.2.amhs.priority=SS
subcase.2.amhs.ats-priority=SS
subcase.2.amhs.responsibility=responsible,responsible
subcase.2.amhs.content=Basic IPM priority SS both responsible
subcase.2.amhs.notify-control-position=true

# Subcase 3: Extended IPM, 1 AMQP consumer (responsible, prec 107) + 1 AMHS user (non-responsible, prec 107)
#   -> CP notification expected (prec 107, responsible AMQP consumer)
subcase.3.id=CTSW020.3
subcase.3.name=1 AMQP Prec 107 resp + 1 AMHS non-resp
subcase.3.amhs.primary-recipients=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/,/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.3.amhs.subject=CTSW020.3
subcase.3.amhs.body-part-type=general-text-body-part
subcase.3.amhs.charset-reg-numbers=1,6
subcase.3.amhs.repertoire=ISO646
subcase.3.amhs.precedence=107
subcase.3.amhs.responsibility=responsible,non-responsible
subcase.3.amhs.content=Extended IPM precedence 107 AMQP responsible AMHS non-responsible
subcase.3.amhs.notify-control-position=true

# Subcase 4: Extended IPM, 2 AMQP consumers (responsible), precedence 14
#   -> NO CP notification (prec 14, not SS/107)
subcase.4.id=CTSW020.4
subcase.4.name=2 AMQP Prec 14
subcase.4.amhs.primary-recipients=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/,/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.4.amhs.subject=CTSW020.4
subcase.4.amhs.body-part-type=general-text-body-part
subcase.4.amhs.charset-reg-numbers=1,6
subcase.4.amhs.repertoire=ISO646
subcase.4.amhs.precedence=14
subcase.4.amhs.responsibility=responsible,responsible
subcase.4.amhs.content=Extended IPM precedence 14 both responsible
subcase.4.amhs.notify-control-position=false

# Subcase 5: Basic IPM, 2 AMQP consumers (responsible), priority DD
#   -> NO CP notification (priority DD, not SS)
subcase.5.id=CTSW020.5
subcase.5.name=2 AMQP Priority DD
subcase.5.amhs.primary-recipients=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/,/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.5.amhs.subject=CTSW020.5
subcase.5.amhs.body-part-type=ia5-text
subcase.5.amhs.priority=DD
subcase.5.amhs.ats-priority=DD
subcase.5.amhs.responsibility=responsible,responsible
subcase.5.amhs.content=Basic IPM priority DD both responsible
subcase.5.amhs.notify-control-position=false
