# Test Case: CTSW003
# Description: Generate a DR for a successfully translated IPM
# Reference: EUR Doc 047 Appendix A, Page 19, Section 4
# Test Class: Normal communications (N)
# Ref: 4.4.8, Doc9880_4.5.6.2.20
#
# All IPMs shall have ATS-Message-Priority "FF" and different combinations of
# originator-report-request and originating-MTA-report-request flags.
# The IUT shall convert all ATS messages into AMQP format and forward DRs if needed.

# Subcase 1: originator-report-request=no-report, originating-MTA-report-request=non-delivery-report
#   -> IUT does NOT return a DR
subcase.1.id=CTSW003.1
subcase.1.name=No-Report/Non-Delivery-Report
subcase.1.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.1.amhs.subject=CTSW003.1
subcase.1.amhs.priority=FF
subcase.1.amhs.body-part-type=ia5-text
subcase.1.amhs.content=Test 1 - no-report/non-delivery-report
subcase.1.amhs.originator-report-request=no-report
subcase.1.amhs.originating-mta-report-request=non-delivery-report
subcase.1.amhs.expected-result=no-dr

# Subcase 2: originator-report-request=no-report, originating-MTA-report-request=report
#   -> IUT returns a DR
subcase.2.id=CTSW003.2
subcase.2.name=No-Report/Report
subcase.2.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.2.amhs.subject=CTSW003.2
subcase.2.amhs.priority=FF
subcase.2.amhs.body-part-type=ia5-text
subcase.2.amhs.content=Test 2 - no-report/report
subcase.2.amhs.originator-report-request=no-report
subcase.2.amhs.originating-mta-report-request=report
subcase.2.amhs.expected-result=dr

# Subcase 3: originator-report-request=no-report, originating-MTA-report-request=audited-report
#   -> IUT returns a DR
subcase.3.id=CTSW003.3
subcase.3.name=No-Report/Audited-Report
subcase.3.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.3.amhs.subject=CTSW003.3
subcase.3.amhs.priority=FF
subcase.3.amhs.body-part-type=ia5-text
subcase.3.amhs.content=Test 3 - no-report/audited-report
subcase.3.amhs.originator-report-request=no-report
subcase.3.amhs.originating-mta-report-request=audited-report
subcase.3.amhs.expected-result=dr

# Subcase 4: originator-report-request=non-delivery-report, originating-MTA-report-request=non-delivery-report
#   -> IUT does NOT return a DR
subcase.4.id=CTSW003.4
subcase.4.name=Non-Delivery-Report/Non-Delivery-Report
subcase.4.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.4.amhs.subject=CTSW003.4
subcase.4.amhs.priority=FF
subcase.4.amhs.body-part-type=ia5-text
subcase.4.amhs.content=Test 4 - non-delivery-report/non-delivery-report
subcase.4.amhs.originator-report-request=non-delivery-report
subcase.4.amhs.originating-mta-report-request=non-delivery-report
subcase.4.amhs.expected-result=no-dr

# Subcase 5: originator-report-request=non-delivery-report, originating-MTA-report-request=report
#   -> IUT returns a DR
subcase.5.id=CTSW003.5
subcase.5.name=Non-Delivery-Report/Report
subcase.5.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.5.amhs.subject=CTSW003.5
subcase.5.amhs.priority=FF
subcase.5.amhs.body-part-type=ia5-text
subcase.5.amhs.content=Test 5 - non-delivery-report/report
subcase.5.amhs.originator-report-request=non-delivery-report
subcase.5.amhs.originating-mta-report-request=report
subcase.5.amhs.expected-result=dr

# Subcase 6: originator-report-request=non-delivery-report, originating-MTA-report-request=audited-report
#   -> IUT returns a DR
subcase.6.id=CTSW003.6
subcase.6.name=Non-Delivery-Report/Audited-Report
subcase.6.amhs.recipient=/CN=VVTSSWIM/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.6.amhs.subject=CTSW003.6
subcase.6.amhs.priority=FF
subcase.6.amhs.body-part-type=ia5-text
subcase.6.amhs.content=Test 6 - non-delivery-report/audited-report
subcase.6.amhs.originator-report-request=non-delivery-report
subcase.6.amhs.originating-mta-report-request=audited-report
subcase.6.amhs.expected-result=dr
